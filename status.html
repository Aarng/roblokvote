<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Global - Proyecto Piece</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #aaa;
            font-size: 1rem;
        }

        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }

        .stats-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .category-section {
            margin-bottom: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .category-stats {
            margin-left: auto;
            color: #aaa;
            font-size: 0.9rem;
        }

        .characters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .character-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s;
        }

        .character-card:hover {
            transform: translateY(-3px);
            background: rgba(255,255,255,0.15);
        }

        .character-emoji {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            flex-shrink: 0;
            overflow: hidden;
        }

        .character-emoji img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .character-info {
            flex: 1;
            min-width: 0;
        }

        .character-name {
            font-weight: bold;
            color: white;
            font-size: 1rem;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .character-anime {
            font-size: 0.8rem;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .approval-bar {
            width: 80px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .approval-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .approval-text {
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 5px;
        }

        .votes-count {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
        }

        .loading {
            text-align: center;
            color: white;
            padding: 50px;
            font-size: 1.2rem;
        }

        .error {
            text-align: center;
            color: #e74c3c;
            padding: 50px;
            font-size: 1.2rem;
        }

        .category-melee { background: #e74c3c; }
        .category-espada { background: #3498db; }
        .category-magia { background: #9b59b6; }

        .admin-link {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .admin-link:hover {
            background: rgba(255,255,255,0.2);
        }

        @media (max-width: 768px) {
            .characters-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-btn">🏠 Inicio</a>
    <a href="statusadmin.html" class="admin-link">🔐 Admin</a>

    <div class="header">
        <h1>📊 Status Global</h1>
        <p>Porcentaje de aprobación de personajes por categoría</p>
    </div>

    <div class="stats-container" id="statsContainer">
        <div class="loading">Cargando estadísticas...</div>
    </div>

    <script src="convex-client.js?v=9"></script>
    <script>
        const categoryColors = {
            'MELEE': { bg: '#e74c3c', gradient: 'linear-gradient(135deg, #e74c3c 0%, #c0392b 100%)' },
            'ESPADA': { bg: '#3498db', gradient: 'linear-gradient(135deg, #3498db 0%, #2980b9 100%)' },
            'MAGIA': { bg: '#9b59b6', gradient: 'linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%)' }
        };

        async function loadStats() {
            const container = document.getElementById('statsContainer');

            try {
                console.log('[Status] Cargando estadísticas y personajes...');

                // Cargar votos y personajes en paralelo
                const [results, characters] = await Promise.all([
                    convexQuery('votes:getGlobalResults'),
                    convexQuery('characters:getAllCharacters')
                ]);

                console.log('[Status] Resultados:', results);
                console.log('[Status] Personajes:', characters);

                // Crear mapa de nombre → imagen
                const characterImages = {};
                if (characters && characters.length > 0) {
                    characters.forEach(char => {
                        characterImages[char.name] = char.image || char.emoji || '👤';
                    });
                }

                if (!results || Object.keys(results).length === 0) {
                    container.innerHTML = '<div class="error">No hay votos registrados aún</div>';
                    return;
                }

                let html = '';

                // Ordenar categorías
                const categories = ['MELEE', 'ESPADA', 'MAGIA'];

                for (const category of categories) {
                    if (!results[category]) continue;

                    const catData = results[category];
                    const categoryApproval = catData.total > 0 ? Math.round((catData.yes / catData.total) * 100) : 0;

                    // Ordenar personajes por votos totales
                    const categoryCharacters = Object.entries(catData.characters)
                        .map(([name, votes]) => ({
                            name,
                            ...votes,
                            total: votes.yes + votes.no,
                            approval: votes.yes + votes.no > 0 ? Math.round((votes.yes / (votes.yes + votes.no)) * 100) : 0
                        }))
                        .sort((a, b) => b.total - a.total);

                    html += `
                        <div class="category-section">
                            <div class="category-header">
                                <div class="category-title" style="color: ${categoryColors[category].bg}">${category}</div>
                                <div class="category-stats">
                                    Aprobación global: <strong style="color: ${categoryColors[category].bg}">${categoryApproval}%</strong>
                                    (${catData.yes}/${catData.total} votos)
                                </div>
                            </div>
                            <div class="characters-grid">
                                ${categoryCharacters.map(char => {
                                    const imgUrl = characterImages[char.name];
                                    const isImage = imgUrl && (imgUrl.startsWith('http') || imgUrl.startsWith('https'));
                                    return `
                                    <div class="character-card">
                                        <div class="character-emoji" style="background: ${categoryColors[category].gradient}">
                                            ${isImage ? `<img src="${imgUrl}" alt="${char.name}" onerror="this.style.display='none'; this.parentElement.textContent='👤';">` : '👤'}
                                        </div>
                                        <div class="character-info">
                                            <div class="character-name">${char.name}</div>
                                            <div class="approval-bar">
                                                <div class="approval-fill" style="width: ${char.approval}%; background: ${categoryColors[category].bg}"></div>
                                            </div>
                                            <div class="approval-text" style="color: ${categoryColors[category].bg}">
                                                ${char.approval}% aprobación
                                            </div>
                                            <div class="votes-count">
                                                ${char.yes} ✅ / ${char.no} ❌ (${char.total} total)
                                            </div>
                                        </div>
                                    </div>
                                `}).join('')}
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = html;
            } catch (error) {
                console.error('[Status] Error:', error);
                container.innerHTML = `<div class="error">Error cargando estadísticas: ${error.message}</div>`;
            }
        }

        // Cargar al iniciar
        loadStats();
    </script>
</body>
</html>
