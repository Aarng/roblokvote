<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Piece - Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
        }

        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-screen h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-screen p {
            color: #aaa;
            margin-bottom: 30px;
        }

        .login-form {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .login-form input {
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 15px 25px;
            font-size: 1.2rem;
            color: white;
            text-align: center;
            letter-spacing: 3px;
            width: 250px;
            outline: none;
            transition: border-color 0.3s;
        }

        .login-form input:focus {
            border-color: #f39c12;
        }

        .login-form input::placeholder {
            color: #888;
            letter-spacing: normal;
        }

        .login-form button {
            margin-top: 20px;
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            border: none;
            border-radius: 10px;
            padding: 15px 40px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(243, 156, 18, 0.4);
        }

        .error-msg {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .content-screen {
            display: none;
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 25px 40px;
            border-radius: 15px;
            text-align: center;
            min-width: 150px;
        }

        .stat-card.melee { border-top: 4px solid #e74c3c; }
        .stat-card.espada { border-top: 4px solid #3498db; }
        .stat-card.magia { border-top: 4px solid #9b59b6; }
        .stat-card.total { border-top: 4px solid #f39c12; }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #aaa;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .categories-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
        }

        .category-section {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
        }

        .category-section h2 {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.5rem;
        }

        .category-section.melee h2 { background: #e74c3c; }
        .category-section.espada h2 { background: #3498db; }
        .category-section.magia h2 { background: #9b59b6; }

        .characters-grid {
            display: grid;
            gap: 10px;
        }

        .character-item {
            background: rgba(255,255,255,0.1);
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, background 0.2s;
        }

        .character-item:hover {
            background: rgba(255,255,255,0.15);
            transform: translateX(5px);
        }

        .character-info {
            flex: 1;
        }

        .character-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .character-anime {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 2px;
        }

        .character-votes {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .logout-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(231, 76, 60, 0.3);
            border-color: #e74c3c;
        }

        @media (max-width: 768px) {
            .categories-container {
                grid-template-columns: 1fr;
            }

            .stat-card {
                min-width: 120px;
                padding: 20px 25px;
            }

            .stat-card .number {
                font-size: 2rem;
            }
        }
    </style>
</head>

        // Verificar contraseña
        function checkPassword() {
            const input = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-msg');

            if (input === 'status2026') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('content-screen').style.display = 'block';
                errorMsg.style.display = 'none';
                renderData();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('password-input').value = '';
            }
        }

        // Enter key support
        document.getElementById('password-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // Render character data
        function renderData() {
            // Update stats
            const meleeTotal = charactersData.melee.length;
            const espadaTotal = charactersData.espada.length;
            const magiaTotal = charactersData.magia.length;
            const total = meleeTotal + espadaTotal + magiaTotal;

            document.getElementById('melee-count').textContent = meleeTotal;
            document.getElementById('espada-count').textContent = espadaTotal;
            document.getElementById('magia-count').textContent = magiaTotal;
            document.getElementById('total-count').textContent = total;

            // Render each category
            renderCategory('melee-grid', charactersData.melee, 'melee');
            renderCategory('espada-grid', charactersData.espada, 'espada');
            renderCategory('magia-grid', charactersData.magia, 'magia');
        }

        function renderCategory(gridId, characters, category) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';

            characters.forEach((char, index) => {
                const item = document.createElement('div');
                item.className = 'character-item';
                item.innerHTML = `
                    <div class="character-info">
                        <div class="character-name">${char.name}</div>
                        <div class="character-anime">${char.anime}</div>
                    </div>
                    <div class="character-votes">#${index + 1}</div>
                `;
                grid.appendChild(item);
            });
        }

        function logout() {
            document.getElementById('content-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('password-input').value = '';
        }
