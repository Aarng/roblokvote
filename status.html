<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Piece - Resultados Globales</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 100;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: #aaa;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 25px 40px;
            border-radius: 15px;
            text-align: center;
            min-width: 140px;
        }

        .stat-card.melee { border-top: 4px solid #e74c3c; }
        .stat-card.espada { border-top: 4px solid #3498db; }
        .stat-card.magia { border-top: 4px solid #9b59b6; }
        .stat-card.total { border-top: 4px solid #2ecc71; }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card .label {
            color: #aaa;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .results-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .category-section {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .category-section h2 {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.5rem;
        }

        .category-section.melee h2 { background: #e74c3c; }
        .category-section.espada h2 { background: #3498db; }
        .category-section.magia h2 { background: #9b59b6; }

        .characters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .character-item {
            background: rgba(255,255,255,0.1);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.2s;
        }

        .character-item:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }

        .character-rank {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
        }

        .character-rank.top-1 { background: #f1c40f; color: #333; }
        .character-rank.top-2 { background: #bdc3c7; color: #333; }
        .character-rank.top-3 { background: #cd7f32; color: white; }
        .character-rank.other { background: rgba(255,255,255,0.2); color: #aaa; }

        .character-info {
            flex: 1;
        }

        .character-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 3px;
        }

        .character-anime {
            font-size: 0.8rem;
            color: #aaa;
        }

        .character-stats {
            text-align: right;
        }

        .character-votes {
            font-size: 1.3rem;
            font-weight: bold;
            color: #f39c12;
        }

        .character-percent {
            font-size: 0.85rem;
            color: #2ecc71;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .progress-fill.melee { background: #e74c3c; }
        .progress-fill.espada { background: #3498db; }
        .progress-fill.magia { background: #9b59b6; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .admin-link {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .admin-link:hover {
            background: rgba(243, 156, 18, 0.3);
            border-color: #f39c12;
        }

        @media (max-width: 768px) {
            .characters-grid {
                grid-template-columns: 1fr;
            }

            .stat-card {
                min-width: 100px;
                padding: 20px 25px;
            }

            .stat-card .number {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="home-btn">🏠 Proyecto Piece</a>

    <div class="header">
        <h1>🌍 Resultados Globales</h1>
        <p>Estadísticas de votación acumuladas</p>
    </div>

    <div class="stats" id="global-stats">
        <div class="stat-card melee">
            <div class="number" id="total-melee">0</div>
            <div class="label">MELEE</div>
        </div>
        <div class="stat-card espada">
            <div class="number" id="total-espada">0</div>
            <div class="label">ESPADA</div>
        </div>
        <div class="stat-card magia">
            <div class="number" id="total-magia">0</div>
            <div class="label">MAGIA</div>
        </div>
        <div class="stat-card total">
            <div class="number" id="total-voters">0</div>
            <div class="label">VOTANTES</div>
        </div>
    </div>

    <div class="results-container" id="results-container">
        <!-- Se genera dinámicamente -->
    </div>

    <a href="proyectopiecestatus.html" class="admin-link">🔐 Panel Admin</a>

    <script>
        // Get all results from localStorage
        function getAllResults() {
            return JSON.parse(localStorage.getItem('proyectpiece_results') || '[]');
        }

        function loadResults() {
            const allResults = getAllResults();
            const container = document.getElementById('results-container');

            if (allResults.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>🗳️ No hay datos de votación</h3>
                        <p>Los resultados aparecerán aquí cuando los votantes completen la votación.<br>
                        Puedes importar archivos JSON desde el Panel Admin.</p>
                    </div>
                `;
                document.getElementById('global-stats').style.display = 'none';
                return;
            }

            document.getElementById('global-stats').style.display = 'flex';

            // Calcular totales
            let totalVoters = allResults.length;
            let totalMelee = 0, totalEspada = 0, totalMagia = 0;

            // Contar votos por personaje
            const votesByCharacter = {};

            allResults.forEach(result => {
                totalMelee += result.favoritos_por_categoria?.MELEE?.length || 0;
                totalEspada += result.favoritos_por_categoria?.ESPADA?.length || 0;
                totalMagia += result.favoritos_por_categoria?.MAGIA?.length || 0;

                // Contar votos por personaje
                ['MELEE', 'ESPADA', 'MAGIA'].forEach(cat => {
                    (result.favoritos_por_categoria?.[cat] || []).forEach(char => {
                        const key = char.name + '|' + char.anime + '|' + cat;
                        if (!votesByCharacter[key]) {
                            votesByCharacter[key] = {
                                name: char.name,
                                anime: char.anime,
                                category: cat,
                                votes: 0
                            };
                        }
                        votesByCharacter[key].votes++;
                    });
                });
            });

            // Actualizar stats
            document.getElementById('total-melee').textContent = totalMelee;
            document.getElementById('total-espada').textContent = totalEspada;
            document.getElementById('total-magia').textContent = totalMagia;
            document.getElementById('total-voters').textContent = totalVoters;

            // Separar por categoría y ordenar
            const categories = {
                MELEE: [],
                ESPADA: [],
                MAGIA: []
            };

            Object.values(votesByCharacter).forEach(char => {
                if (categories[char.category]) {
                    categories[char.category].push(char);
                }
            });

            // Ordenar por votos
            Object.keys(categories).forEach(cat => {
                categories[cat].sort((a, b) => b.votes - a.votes);
            });

            // Renderizar
            container.innerHTML = '';

            ['MELEE', 'ESPADA', 'MAGIA'].forEach(cat => {
                const chars = categories[cat];
                const catLower = cat.toLowerCase();
                const maxVotes = Math.max(...chars.map(c => c.votes), 1);

                container.innerHTML += `
                    <div class="category-section ${catLower}">
                        <h2>${cat}</h2>
                        <div class="characters-grid">
                            ${chars.map((char, index) => {
                                const percentage = ((char.votes / totalVoters) * 100).toFixed(1);
                                const rankClass = index === 0 ? 'top-1' : index === 1 ? 'top-2' : index === 2 ? 'top-3' : 'other';
                                const progressWidth = (char.votes / maxVotes * 100).toFixed(0);

                                return `
                                    <div class="character-item">
                                        <div class="character-rank ${rankClass}">${index + 1}</div>
                                        <div class="character-info">
                                            <div class="character-name">${char.name}</div>
                                            <div class="character-anime">${char.anime}</div>
                                            <div class="progress-bar">
                                                <div class="progress-fill ${catLower}" style="width: ${progressWidth}%"></div>
                                            </div>
                                        </div>
                                        <div class="character-stats">
                                            <div class="character-votes">${char.votes}</div>
                                            <div class="character-percent">${percentage}%</div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            });
        }

        // Cargar al iniciar
        loadResults();

        // Recargar cada 5 segundos (para ver actualizaciones en tiempo real)
        setInterval(loadResults, 5000);
    </script>

    <!-- Lista curada de personajes -->
    <script src="curated-data.js"></script>
    <script>
        // Sobreescribir loadResults para usar curatedCharacters
        function loadResults() {
            const allResults = getAllResults();

            // Calcular totales
            let totalVoters = allResults.length;
            let totalMelee = 0, totalEspada = 0, totalMagia = 0;

            // Inicializar conteo de votos para cada personaje de la lista curada
            const characterVotes = {};

            // Inicializar con 0 votos para todos los personajes curados
            ['melee', 'espada', 'magia'].forEach(cat => {
                const catUpper = cat.toUpperCase();
                curatedCharacters[cat].forEach(char => {
                    const key = char.name + '|' + char.anime + '|' + catUpper;
                    characterVotes[key] = {
                        name: char.name,
                        anime: char.anime,
                        category: catUpper,
                        votes: 0
                    };
                });
            });

            // Sumar votos de los resultados guardados
            allResults.forEach(result => {
                totalMelee += result.favoritos_por_categoria?.MELEE?.length || 0;
                totalEspada += result.favoritos_por_categoria?.ESPADA?.length || 0;
                totalMagia += result.favoritos_por_categoria?.MAGIA?.length || 0;

                ['MELEE', 'ESPADA', 'MAGIA'].forEach(cat => {
                    (result.favoritos_por_categoria?.[cat] || []).forEach(char => {
                        const key = char.name + '|' + char.anime + '|' + cat;
                        if (characterVotes[key]) {
                            characterVotes[key].votes++;
                        }
                    });
                });
            });

            // Actualizar stats
            document.getElementById('total-melee').textContent = totalMelee;
            document.getElementById('total-espada').textContent = totalEspada;
            document.getElementById('total-magia').textContent = totalMagia;
            document.getElementById('total-voters').textContent = totalVoters;

            // Separar por categoría y ordenar
            const categories = {
                MELEE: [],
                ESPADA: [],
                MAGIA: []
            };

            Object.values(characterVotes).forEach(char => {
                if (categories[char.category]) {
                    categories[char.category].push(char);
                }
            });

            // Ordenar por votos (descendente)
            Object.keys(categories).forEach(cat => {
                categories[cat].sort((a, b) => b.votes - a.votes);
            });

            // Renderizar
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            // Verificar si hay datos
            if (totalVoters === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>🗳️ No hay votos registrados aún</h3>
                        <p>La lista muestra los personajes de la votación privada.<br>
                        Los porcentajes aparecerán cuando los votantes completen la votación.</p>
                    </div>
                `;
            }

            ['MELEE', 'ESPADA', 'MAGIA'].forEach(cat => {
                const chars = categories[cat];
                const catLower = cat.toLowerCase();
                const maxVotes = Math.max(...Object.values(characterVotes).map(c => c.votes), 1);

                container.innerHTML += `
                    <div class="category-section ${catLower}">
                        <h2>${cat} <span style="font-size: 0.7em; opacity: 0.8;">(${chars.length} personajes)</span></h2>
                        <div class="characters-grid">
                            ${chars.map((char, index) => {
                                const percentage = totalVoters > 0 ? ((char.votes / totalVoters) * 100).toFixed(1) : '0.0';
                                const rankClass = index === 0 && char.votes > 0 ? 'top-1' :
                                                  index === 1 && char.votes > 0 ? 'top-2' :
                                                  index === 2 && char.votes > 0 ? 'top-3' : 'other';
                                const progressWidth = maxVotes > 0 ? (char.votes / maxVotes * 100).toFixed(0) : 0;

                                return `
                                    <div class="character-item">
                                        <div class="character-rank ${rankClass}">${index + 1}</div>
                                        <div class="character-info">
                                            <div class="character-name">${char.name}</div>
                                            <div class="character-anime">${char.anime}</div>
                                            <div class="progress-bar">
                                                <div class="progress-fill ${catLower}" style="width: ${progressWidth}%"></div>
                                            </div>
                                        </div>
                                        <div class="character-stats">
                                            <div class="character-votes">${char.votes}</div>
                                            <div class="character-percent">${percentage}%</div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
