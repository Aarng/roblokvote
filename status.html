<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Sea Lords</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        :root {
            --primary: #a855f7;
            --primary-light: #c084fc;
            --primary-dark: #7c3aed;
            --accent: #ec4899;
            --dark: #0a0a0f;
            --darker: #050508;
            --surface: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark);
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Glow effects background */
        .glow-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
        }

        .glow-orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--primary), transparent 70%);
            top: -150px;
            right: -100px;
            animation: float-orb 8s ease-in-out infinite;
        }

        .glow-orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent), transparent 70%);
            bottom: 10%;
            left: -100px;
            animation: float-orb 6s ease-in-out infinite reverse;
        }

        @keyframes float-orb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px 40px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
            font-weight: 700;
            font-size: 1.5rem;
        }

        .nav-logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: white;
        }

        .nav-links a.active {
            color: var(--primary-light);
        }

        /* Main Content */
        .main-content {
            position: relative;
            z-index: 1;
            padding: 140px 20px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .header h1 .gradient-text {
            background: linear-gradient(135deg, #fff, var(--primary-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.1rem;
        }

        /* Stats Cards Summary */
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .summary-card {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .summary-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(168, 85, 247, 0.2);
        }

        .summary-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .summary-value {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .summary-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
        }

        /* Category Sections */
        .category-section {
            margin-bottom: 40px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            transition: transform 0.3s ease;
        }

        .category-section:hover {
            transform: translateY(-3px);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .category-stats {
            margin-left: auto;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
        }

        .category-stats strong {
            font-weight: 700;
        }

        .characters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .character-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .character-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .character-emoji {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
            overflow: hidden;
        }

        .character-emoji img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .character-info {
            flex: 1;
            min-width: 0;
        }

        .character-name {
            font-weight: 600;
            color: white;
            font-size: 1rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .approval-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }

        .approval-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .approval-text {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .votes-count {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        /* Loading & Error States */
        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            padding: 80px 20px;
            font-size: 1.1rem;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            margin-left: 10px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            color: #e74c3c;
            padding: 80px 20px;
            font-size: 1.1rem;
            background: rgba(231, 76, 60, 0.1);
            border-radius: 16px;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .category-melee { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .category-espada { background: linear-gradient(135deg, #3498db, #2980b9); }
        .category-magia { background: linear-gradient(135deg, #9b59b6, #8e44ad); }

        /* Admin Link */
        .admin-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .admin-link:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: rgba(168, 85, 247, 0.4);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .nav-links {
                display: none;
            }

            .main-content {
                padding: 100px 15px 40px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .characters-grid {
                grid-template-columns: 1fr;
            }

            .category-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .category-stats {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Background glow effects -->
    <div class="glow-container">
        <div class="glow-orb glow-orb-1"></div>
        <div class="glow-orb glow-orb-2"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="sealordslogo.webp" alt="Sea Lords" style="width: 40px; height: 40px; border-radius: 10px; object-fit: cover;">
                <span>Sea Lords</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="vote.html">Votar</a></li>
                <li><a href="status.html" class="active">Estadísticas</a></li>
                <li><a href="recommendations.html">Recomendar</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-content">
        <div class="header">
            <h1>📊 Estadísticas <span class="gradient-text">Globales</span></h1>
            <p>Porcentaje de aprobación de personajes por categoría</p>
        </div>

        <!-- Stats Summary -->
        <div class="stats-summary" id="statsSummary">
            <div class="summary-card">
                <div class="summary-icon">⚔️</div>
                <div class="summary-value" id="totalVoters">-</div>
                <div class="summary-label">Votantes Totales</div>
            </div>
            <div class="summary-card">
                <div class="summary-icon">🗳️</div>
                <div class="summary-value" id="totalVotes">-</div>
                <div class="summary-label">Votos Registrados</div>
            </div>
            <div class="summary-card">
                <div class="summary-icon">👥</div>
                <div class="summary-value">123</div>
                <div class="summary-label">Personajes</div>
            </div>
        </div>

        <div class="stats-container" id="statsContainer">
            <div class="loading">Cargando estadísticas...</div>
        </div>
    </div>

    <a href="statusadmin.html" class="admin-link">🔐 Admin</a>

    <script src="convex-client.js?v=22"></script>
    <script>
        const categoryColors = {
            'MELEE': { bg: '#e74c3c', gradient: 'linear-gradient(135deg, #e74c3c 0%, #c0392b 100%)' },
            'ESPADA': { bg: '#3498db', gradient: 'linear-gradient(135deg, #3498db 0%, #2980b9 100%)' },
            'MAGIA': { bg: '#9b59b6', gradient: 'linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%)' }
        };

        async function loadStats() {
            const container = document.getElementById('statsContainer');

            try {
                console.log('[Status] Cargando estadísticas y personajes...');

                const [results, characters, voters] = await Promise.all([
                    convexQuery('votes:getGlobalResults'),
                    convexQuery('characters:getAllCharacters'),
                    convexQuery('votes:getAllVoters')
                ]);

                console.log('[Status] Resultados:', results);

                // Update summary stats
                if (voters) {
                    document.getElementById('totalVoters').textContent = voters.length;
                }

                let totalVotes = 0;
                if (results) {
                    Object.values(results).forEach(cat => {
                        totalVotes += cat.total || 0;
                    });
                }
                document.getElementById('totalVotes').textContent = totalVotes.toLocaleString();

                const characterImages = {};
                if (characters && characters.length > 0) {
                    characters.forEach(char => {
                        characterImages[char.name] = char.image || char.emoji || '👤';
                    });
                }

                if (!results || Object.keys(results).length === 0) {
                    container.innerHTML = '<div class="error">No hay votos registrados aún</div>';
                    return;
                }

                let html = '';
                const categories = ['MELEE', 'ESPADA', 'MAGIA'];

                for (const category of categories) {
                    if (!results[category]) continue;

                    const catData = results[category];
                    const categoryApproval = catData.total > 0 ? Math.round((catData.yes / catData.total) * 100) : 0;

                    const categoryCharacters = Object.entries(catData.characters)
                        .map(([name, votes]) => ({
                            name,
                            ...votes,
                            total: votes.yes + votes.no,
                            approval: votes.yes + votes.no > 0 ? Math.round((votes.yes / (votes.yes + votes.no)) * 100) : 0
                        }))
                        .sort((a, b) => b.total - a.total);

                    html += `
                        <div class="category-section">
                            <div class="category-header">
                                <div class="category-title" style="color: ${categoryColors[category].bg}">${category}</div>
                                <div class="category-stats">
                                    Aprobación: <strong style="color: ${categoryColors[category].bg}">${categoryApproval}%</strong>
                                    (${catData.yes}/${catData.total} votos)
                                </div>
                            </div>
                            <div class="characters-grid">
                                ${categoryCharacters.map(char => {
                                    const imgUrl = characterImages[char.name];
                                    const isImage = imgUrl && (imgUrl.startsWith('http') || imgUrl.startsWith('https'));
                                    return `
                                    <div class="character-card">
                                        <div class="character-emoji" style="background: ${categoryColors[category].gradient}">
                                            ${isImage ? `<img src="${imgUrl}" alt="${char.name}" onerror="this.style.display='none'; this.parentElement.textContent='👤';">` : '👤'}
                                        </div>
                                        <div class="character-info">
                                            <div class="character-name">${char.name}</div>
                                            <div class="approval-bar">
                                                <div class="approval-fill" style="width: ${char.approval}%; background: ${categoryColors[category].bg}"></div>
                                            </div>
                                            <div class="approval-text" style="color: ${categoryColors[category].bg}">
                                                ${char.approval}% aprobación
                                            </div>
                                            <div class="votes-count">
                                                ${char.yes} ✅ / ${char.no} ❌ (${char.total} total)
                                            </div>
                                        </div>
                                    </div>
                                `}).join('')}
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = html;
            } catch (error) {
                console.error('[Status] Error:', error);
                container.innerHTML = `<div class="error">Error cargando estadísticas: ${error.message}</div>`;
            }
        }

        loadStats();
    </script>
</body>
</html>
