<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Votación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            padding: 20px;
            color: white;
            width: 100%;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .category-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .category-melee { background: #e74c3c; }
        .category-espada { background: #3498db; }
        .category-magia { background: #9b59b6; }

        .progress {
            color: #aaa;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .card-container {
            position: relative;
            width: 360px;
            max-width: 95vw;
            height: 520px;
            margin: 15px auto;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            cursor: grab;
            user-select: none;
            overflow: hidden;
        }

        .card:active {
            cursor: grabbing;
        }

        .card-image-container {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-fit: contain;
            object-position: center top;
            background: linear-gradient(135deg, #2d3436 0%, #1a1a2e 100%);
        }

        .card-image-fallback {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-anime {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .card-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .card-category {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            width: fit-content;
        }

        .card-title {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.4;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            font-style: italic;
        }

        .stamp {
            position: absolute;
            top: 30px;
            padding: 10px 20px;
            border: 4px solid;
            border-radius: 10px;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            opacity: 0;
            transform: rotate(-15deg);
            transition: opacity 0.2s;
            z-index: 10;
            background: rgba(255,255,255,0.9);
        }

        .stamp-like {
            right: 30px;
            color: #2ecc71;
            border-color: #2ecc71;
        }

        .stamp-nope {
            left: 30px;
            color: #e74c3c;
            border-color: #e74c3c;
        }

        .controls {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }

        .btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 2rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            transform: scale(1.1);
        }

        .btn-nope {
            background: white;
            color: #e74c3c;
            box-shadow: 0 5px 20px rgba(231, 76, 60, 0.3);
        }

        .btn-like {
            background: white;
            color: #2ecc71;
            box-shadow: 0 5px 20px rgba(46, 204, 113, 0.3);
        }

        .results {
            display: none;
            text-align: center;
            color: white;
            padding: 20px;
            width: 100%;
        }

        .results h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 20px auto;
            text-align: left;
        }

        .result-category {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
        }

        .result-category h3 {
            margin-bottom: 10px;
            font-size: 1.1rem;
            padding: 5px 10px;
            border-radius: 8px;
            display: inline-block;
        }

        .result-category ul {
            list-style: none;
        }

        .result-category li {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9rem;
        }

        .result-category li:last-child {
            border-bottom: none;
        }

        .btn-download {
            background: #2ecc71;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
        }

        .instructions {
            color: #aaa;
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
            line-height: 1.6;
        }

        .instructions kbd {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            padding: 2px 8px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #fff;
        }

        .swiping { transition: none !important; }

        .favorite-card {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .favorite-card img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .favorite-card .info {
            flex: 1;
        }

        .favorite-card .name {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .favorite-card .anime {
            font-size: 0.75rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🗳️ Votación de Personajes</h1>
        <div style="margin-bottom: 15px;">
            <a href="lobby.html" style="color: #f39c12; text-decoration: none; font-size: 1rem;">
                👥 Modo Multijugador →
            </a>
        </div>
        <span id="currentCategory" class="category-badge">Cargando...</span>
        <div class="progress" id="progress">Cargando...</div>
    </div>

    <div class="card-container" id="cardContainer">
        <div class="card" id="card">
            <div class="stamp stamp-like">¡SÍ!</div>
            <div class="stamp stamp-nope">NO</div>

            <div class="card-image-container">
                <img class="card-image" id="cardImage" src="" alt="Personaje">
            </div>

            <div class="card-content">
                <div class="card-anime" id="cardAnime">Anime</div>
                <div class="card-name" id="cardName">Cargando...</div>
                <div class="card-category" id="cardCategory">Categoría</div>
                <div class="card-title" id="cardDescription">Título...</div>
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="btn btn-nope" onclick="vote(false)">✕</button>
        <button class="btn btn-like" onclick="vote(true)">✓</button>
    </div>

    <div class="instructions" id="instructions">
        Desliza a la derecha para SÍ ✓ o a la izquierda para NO ✕<br>
        Teclado: <kbd>←</kbd> o <kbd>A</kbd> = NO | <kbd>→</kbd> o <kbd>D</kbd> = SÍ
    </div>

    <div class="results" id="results">
        <h2>🎉 ¡Votación Completada!</h2>
        <p>Estos son tus personajes favoritos por categoría:</p>
        <div class="results-grid" id="resultsGrid"></div>
        <button class="btn-download" onclick="downloadResults()">📥 Descargar Resultados</button>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
