<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados Globales - Proyecto Piece</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #f39c12;
        }

        .header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #aaa;
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #f39c12;
        }

        .category-section {
            max-width: 1200px;
            margin: 0 auto 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid;
        }

        .category-melee .category-header { border-color: #e74c3c; }
        .category-espada .category-header { border-color: #3498db; }
        .category-magia .category-header { border-color: #9b59b6; }

        .category-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .category-melee .category-title { color: #e74c3c; }
        .category-espada .category-title { color: #3498db; }
        .category-magia .category-title { color: #9b59b6; }

        .character-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .character-card {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .character-emoji {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .category-melee .character-emoji { background: #e74c3c; }
        .category-espada .character-emoji { background: #3498db; }
        .category-magia .character-emoji { background: #9b59b6; }

        .character-info {
            flex: 1;
        }

        .character-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .character-votes {
            display: flex;
            gap: 10px;
            font-size: 0.85rem;
        }

        .vote-yes { color: #2ecc71; }
        .vote-no { color: #e74c3c; }
        .vote-percentage {
            margin-left: auto;
            font-weight: bold;
            color: #f39c12;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #aaa;
        }

        .error {
            text-align: center;
            padding: 50px;
            color: #e74c3c;
        }

        .refresh-btn {
            display: block;
            margin: 30px auto;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
        }

        .refresh-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Resultados Globales</h1>
        <p>Votación de personajes anime - Proyecto Piece</p>
    </div>

    <div id="content">
        <div class="loading">Cargando resultados de Convex...</div>
    </div>

    <script src="convex-client.js"></script>
    <script>
        const CONVEX_URL = 'https://hallowed-badger-330.convex.cloud/';

        async function loadGlobalResults() {
            const content = document.getElementById('content');

            try {
                const response = await fetch(`${CONVEX_URL}/api/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        path: 'votes:getGlobalResults',
                        args: {}
                    })
                });

                if (!response.ok) {
                    throw new Error('Error al cargar resultados');
                }

                const results = await response.json();
                renderResults(results);
            } catch (error) {
                console.error('Error:', error);
                content.innerHTML = `
                    <div class="error">
                        <h2>❌ Error de conexión</h2>
                        <p>No se pudieron cargar los resultados de Convex.</p>
                        <p>${error.message}</p>
                        <p>Verifica que:</p>
                        <ul style="text-align: left; display: inline-block; margin-top: 20px;">
                            <li>El proyecto Convex esté activo</li>
                            <li>Las funciones estén desplegadas</li>
                            <li>La URL sea correcta</li>
                        </ul>
                    </div>
                `;
            }
        }

        function renderResults(results) {
            const content = document.getElementById('content');

            if (!results || Object.keys(results).length === 0) {
                content.innerHTML = `
                    <div class="loading">
                        <h2>📝 No hay datos aún</h2>
                        <p>Sé el primero en votar para ver los resultados aquí.</p>
                    </div>
                `;
                return;
            }

            // Calcular totales
            let totalVotes = 0;
            let totalYes = 0;

            Object.values(results).forEach(cat => {
                totalVotes += cat.total;
                totalYes += cat.yes;
            });

            const totalVoters = Math.floor(totalVotes / 121); // Aproximado

            let html = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Votos</h3>
                        <div class="number">${totalVotes.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Votantes</h3>
                        <div class="number">~${totalVoters}</div>
                    </div>
                    <div class="stat-card">
                        <h3>Aprobación General</h3>
                        <div class="number">${totalVotes > 0 ? Math.round((totalYes / totalVotes) * 100) : 0}%</div>
                    </div>
                </div>
            `;

            // Renderizar por categoría
            const categoryNames = { 'MELEE': '⚔️ MELEE', 'ESPADA': '🗡️ ESPADA', 'MAGIA': '✨ MAGIA' };
            const categoryClasses = { 'MELEE': 'category-melee', 'ESPADA': 'category-espada', 'MAGIA': 'category-magia' };

            for (const [catName, catData] of Object.entries(results)) {
                if (!catData.characters) continue;

                const characters = Object.entries(catData.characters)
                    .sort((a, b) => (b[1].yes + b[1].no) - (a[1].yes + a[1].no));

                html += `
                    <div class="category-section ${categoryClasses[catName]}">
                        <div class="category-header">
                            <div class="category-title">${categoryNames[catName] || catName}</div>
                            <div>Total: ${catData.total} votos</div>
                        </div>
                        <div class="character-list">
                `;

                for (const [charName, votes] of characters.slice(0, 10)) {
                    const total = votes.yes + votes.no;
                    const percentage = total > 0 ? Math.round((votes.yes / total) * 100) : 0;

                    html += `
                        <div class="character-card">
                            <div class="character-emoji">👤</div>
                            <div class="character-info">
                                <div class="character-name">${charName}</div>
                                <div class="character-votes">
                                    <span class="vote-yes">✓ ${votes.yes}</span>
                                    <span class="vote-no">✕ ${votes.no}</span>
                                    <span class="vote-percentage">${percentage}%</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            html += `
                <button class="refresh-btn" onclick="loadGlobalResults()">
                    🔄 Actualizar Resultados
                </button>
            `;

            content.innerHTML = html;
        }

        // Cargar al iniciar
        loadGlobalResults();

        // Auto-refresh cada 30 segundos
        setInterval(loadGlobalResults, 30000);
    </script>
</body>
</html>
