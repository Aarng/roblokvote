<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Piece - Acceso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: #aaa;
            margin-bottom: 30px;
        }

        .login-form {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        input {
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 15px 25px;
            font-size: 1.2rem;
            color: white;
            text-align: center;
            width: 250px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #f39c12;
        }

        input::placeholder {
            color: #888;
        }

        button {
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 15px 40px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .error {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .back-link {
            display: block;
            margin-top: 30px;
            color: #aaa;
            text-decoration: none;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Proyecto Piece</h1>
        <p>Modo Multijugador Privado</p>

        <div class="login-form">
            <input type="password" id="access-code" placeholder="Ingresa el código de acceso" maxlength="20">
            <br>
            <button onclick="checkAccess()">Acceder</button>
            <div id="error" class="error">Código incorrecto</div>
        </div>

        <a href="index.html" class="back-link">← Volver al inicio</a>
    </div>

    <script>
        function checkAccess() {
            const code = document.getElementById('access-code').value.toLowerCase().trim();

            if (code === 'proyectpiece') {
                // Guardar sesión en sessionStorage
                sessionStorage.setItem('proyectpiece_access', 'true');
                // Redirigir a lobby
                window.location.href = 'lobby.html';
            } else {
                document.getElementById('error').style.display = 'block';
                document.getElementById('access-code').value = '';
            }
        }

        // Enter key support
        document.getElementById('access-code').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAccess();
            }
        });
    </script>
</body>
</html>
